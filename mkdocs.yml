site_name: "Python Documentation by Use-Case: Making it Simple"
theme:
  name: material
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Introduction: introduction.md
  - Syntax and Semantics: syntax-and-semantics.md
  - Python Engine: python-engine.md
